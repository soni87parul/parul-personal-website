backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "homepage"
    label: "Homepage"
    editor:
      preview: false
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "src/_data/homepage.json"
        fields:
          - { label: "Hero — Positioning Label", name: "heroPositioningLabel", widget: "string" }
          - { label: "Hero — Headline", name: "heroHeadline", widget: "string" }
          - { label: "Hero — Supporting Text", name: "heroSubtext", widget: "text" }
          - { label: "Hero — Image", name: "heroImage", widget: "image", required: false }
          - { label: "Hero — Image Alt Text", name: "heroImageAlt", widget: "string", required: false }
          - { label: "Hero — Primary CTA Label", name: "heroPrimaryCtaLabel", widget: "string" }
          - { label: "Hero — Primary CTA Link", name: "heroPrimaryCtaLink", widget: "string" }
          - { label: "Hero — Secondary CTA Label", name: "heroSecondaryCtaLabel", widget: "string" }
          - { label: "Hero — Secondary CTA Link", name: "heroSecondaryCtaLink", widget: "string" }
          - label: "Hero — Supporting Glimpses (2-3 small placeholders shown around the portrait)"
            name: "heroSupportingGlimpses"
            widget: "list"
            required: false
            fields:
              - { label: "Label (what the future photo will show)", name: "label", widget: "string" }
              - { label: "Aspect Ratio (e.g. \"3/2\", \"16/9\")", name: "ratio", widget: "string" }

          - { label: "Credibility — Heading", name: "credibilityHeading", widget: "string" }
          - label: "Credibility — Organisation Names"
            name: "credibilityLogos"
            widget: "list"

          - { label: "Signature Statement (personal pull-quote, shown between Credibility and Method)", name: "signatureStatement", widget: "string" }

          - { label: "Method — Heading", name: "methodHeading", widget: "string" }
          - { label: "Method — Subheading", name: "methodSubheading", widget: "text" }
          - label: "Method — Five Stages"
            name: "methodStages"
            widget: "list"
            fields:
              - { label: "Number (e.g. 01)", name: "number", widget: "string" }
              - { label: "Stage Title", name: "title", widget: "string" }
              - { label: "Action Phrase (e.g. \"Find the real constraint\")", name: "action", widget: "string" }
              - { label: "Discoverable Example (a short concrete example shown on hover/tap/focus)", name: "example", widget: "string" }

          - { label: "Experience — Heading", name: "experienceHeading", widget: "string" }
          - { label: "Experience — Subheading", name: "experienceSubheading", widget: "text" }
          - { label: "Experience — View All CTA Label", name: "experienceViewAllLabel", widget: "string" }

          - { label: "Thinking — Heading", name: "thinkingHeading", widget: "string" }
          - { label: "Thinking — Subheading", name: "thinkingSubheading", widget: "text" }
          - { label: "Thinking — CTA Label", name: "thinkingCtaLabel", widget: "string" }

          - { label: "Speaking — Heading", name: "speakingHeading", widget: "string" }
          - { label: "Speaking — Text", name: "speakingText", widget: "text" }
          - { label: "Speaking — CTA Label", name: "speakingCtaLabel", widget: "string" }

          - { label: "Final CTA — Heading", name: "finalCtaHeading", widget: "string" }
          - { label: "Final CTA — Text", name: "finalCtaText", widget: "text" }
          - { label: "Final CTA — Primary Label", name: "finalCtaPrimaryLabel", widget: "string" }
          - { label: "Final CTA — Secondary Label", name: "finalCtaSecondaryLabel", widget: "string" }
          - { label: "Final CTA — Opportunity Line (quiet list beneath, middot-separated)", name: "opportunityLine", widget: "string" }

      - name: "experiencePage"
        label: "Experience Page Intro"
        file: "src/_data/experiencePage.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Supporting Statement", name: "supportingStatement", widget: "string" }
          - { label: "Introduction Paragraphs (optional, one per line)", name: "explanationParagraphs", widget: "list", required: false }

  - name: "about"
    label: "About Page"
    editor:
      preview: false
    files:
      - name: "about"
        label: "About Page Content"
        file: "src/about.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/about.njk" }
          - { label: "Heading", name: "title", widget: "string" }
          - { label: "Short Introduction (who Parul is, shown right under the heading)", name: "shortIntro", widget: "text" }
          - { label: "How I Got Here (optional — hidden until filled in)", name: "howIGotHere", widget: "text", required: false }
          - { label: "The Thread Through My Career (optional — hidden until filled in)", name: "threadThroughCareer", widget: "text", required: false }
          - label: "Career Chapters (a short why-focused summary, distinct from the detailed Experience page)"
            name: "careerChapters"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Chapter Label (e.g. \"Learning the customer\")", name: "label", widget: "string" }
              - { label: "One-line Description", name: "description", widget: "string" }
          - { label: "Beyond Work (optional — hidden until filled in)", name: "beyondWork", widget: "text", required: false }
          - { label: "Education (optional, quiet credentials note — hidden until filled in)", name: "education", widget: "text", required: false }
          - { label: "Methodology Reference Line (optional, links to the homepage method section)", name: "methodologyReference", widget: "string", required: false }
          - { label: "SEO Title (optional)", name: "seoTitle", widget: "string", required: false }
          - { label: "SEO Description (optional)", name: "seoDescription", widget: "text", required: false }

  - name: "experience"
    label: "Experience Stories"
    label_singular: "Experience Story"
    folder: "src/experience"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/story.njk" }
      - { label: "Title (problem-led, e.g. \"Building operational capacity without adding headcount\")", name: "title", widget: "string" }
      - { label: "Organisation", name: "organisation", widget: "string" }
      - { label: "Theme (e.g. \"AI / ML Transformation\")", name: "theme", widget: "string" }
      - { label: "Summary (shown on the story page itself)", name: "summary", widget: "text", required: false }
      - { label: "Card Summary (optional — shorter version for the card grid, ~2-3 lines; falls back to Summary above if left blank)", name: "card_summary", widget: "text", required: false }
      - { label: "Year / Period", name: "year_or_period", widget: "string", required: false }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Featured Image Alt Text", name: "featured_image_alt", widget: "string", required: false }

      - label: "Capabilities"
        name: "capabilities"
        widget: "relation"
        collection: "capabilities"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "slug"
        multiple: true
        required: false

      - label: "Methodology Stages (how she approached it — select all that apply)"
        name: "methodology_stages"
        widget: "select"
        multiple: true
        options:
          - { label: "Figure Out", value: "figure-out" }
          - { label: "Design", value: "design" }
          - { label: "Build", value: "build" }
          - { label: "Scale", value: "scale" }
          - { label: "Transform", value: "transform" }
        required: false

      - label: "Public Categories (2-3 short labels shown on the card, e.g. \"Transformation\", \"Chief of Staff\" — curated by you, separate from the filter taxonomy below)"
        name: "public_categories"
        widget: "list"
        required: false

      - { label: "Status Label (optional, e.g. \"Story in progress\" — shown as a small badge)", name: "status_label", widget: "string", required: false }

      - { label: "Industry (optional)", name: "industry", widget: "string", required: false }
      - { label: "Featured (one of the five flagship slots)", name: "featured", widget: "boolean", default: false }
      - { label: "Display Order (lower shows first)", name: "display_order", widget: "number", default: 99 }
      - { label: "Published (show on live site)", name: "published", widget: "boolean", default: false, hint: "Leave unpublished until the story has real content — placeholder text must never go live." }

      - { label: "The Problem", name: "problem", widget: "text", required: false }
      - { label: "Why It Mattered", name: "why_it_mattered", widget: "text", required: false }
      - { label: "Figure Out (only shown if this stage is selected above)", name: "figure_out", widget: "text", required: false }
      - { label: "Design (only shown if this stage is selected above)", name: "design", widget: "text", required: false }
      - { label: "Build (only shown if this stage is selected above)", name: "build", widget: "text", required: false }
      - { label: "Scale (only shown if this stage is selected above)", name: "scale", widget: "text", required: false }
      - { label: "Transform (only shown if this stage is selected above)", name: "transform", widget: "text", required: false }

      - label: "Impact (one or more verified outcomes — leave empty if none yet)"
        name: "impact"
        widget: "list"
        required: false
        summary: "{{fields.value}} — {{fields.label}}"
        fields:
          - { label: "Value (e.g. \"130+\")", name: "value", widget: "string" }
          - { label: "Label (e.g. \"FTE-equivalent capacity created\")", name: "label", widget: "string" }
          - { label: "Context (optional)", name: "context", widget: "string", required: false }
          - { label: "Needs Verification / Sourcing (admin-only — never shown publicly)", name: "verification_required", widget: "boolean", default: false }

      - { label: "My Takeaway", name: "takeaway", widget: "text", required: false }
      - { label: "Additional Body Content (optional, Markdown)", name: "body", widget: "markdown", required: false }

      - label: "Relevant Recommendation(s) (optional — shown on the story page)"
        name: "related_recommendations"
        widget: "relation"
        collection: "recommendations"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "slug"
        multiple: true
        required: false

      - { label: "Related Articles (optional)", name: "related_articles", widget: "list", required: false }
      - { label: "Related Experience (optional)", name: "related_experience", widget: "list", required: false }

      - { label: "SEO Title (optional)", name: "seo_title", widget: "string", required: false }
      - { label: "SEO Description (optional)", name: "seo_description", widget: "text", required: false }
      - { label: "Social Share Image (optional)", name: "og_image", widget: "image", required: false }

  - name: "capabilities"
    label: "Capabilities"
    folder: "src/capabilities"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Permalink (leave as false)", name: "permalink", widget: "hidden", default: false }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Slug (lowercase, hyphenated, must be unique)", name: "slug", widget: "string" }
      - label: "Group"
        name: "group"
        widget: "select"
        options: ["Strategy & Leadership", "Build & Scale", "Technology", "Operations", "Capital & Commercial", "Policy & Ecosystems"]
      - { label: "Description (optional)", name: "description", widget: "text", required: false }
      - { label: "Display Order within group", name: "display_order", widget: "number", default: 99 }
      - { label: "Active (show as a filter option)", name: "active", widget: "boolean", default: true }

  - name: "thinking"
    label: "Thinking / Articles"
    label_singular: "Thinking Article"
    description: "This is the blog. Every article you write and publish lives here — there is no separate Blog section."
    folder: "src/thinking"
    create: true
    slug: "{{slug}}"
    sortableFields: ["title", "date", "territory", "featured", "published"]
    summary: "{{territory}} · {{date}}"
    editor:
      preview: false
    fields:
      # --- Article Basics ---
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/article.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle (optional short deck — falls back to the Excerpt below if left blank)", name: "subtitle", widget: "string", required: false }
      - { label: "Short Excerpt (required — shown on cards, and as the deck under the title if Subtitle is blank)", name: "excerpt", widget: "text" }
      - label: "Thinking Territory (controls the filter and card colour)"
        name: "territory"
        widget: "select"
        options:
          - "Transformation & Organisations"
          - "CEO Office & Strategy"
          - "AI, Technology & Operating Models"
          - "Building & Scaling"
          - "Future of Food & Emerging Industries"
          - "Policy, Markets & Economic Systems"
      - label: "Category (secondary, optional — shown only if Territory is not set)"
        name: "category"
        widget: "select"
        options: ["Essay", "Operator's Notebook", "Framework", "Case Study", "Research", "Book Notes"]
        required: false
      - { label: "Tags (optional)", name: "tags", widget: "list", required: false }

      # --- Content ---
      - { label: "Article Body", name: "body", widget: "markdown" }
      - { label: "Closing Takeaway (optional — shown as a highlighted callout at the end)", name: "takeaway", widget: "text", required: false }
      - { label: "Hero Image (optional — the article looks complete without one)", name: "coverImage", widget: "image", required: false }
      - { label: "Hero Image Alt Text (required if a Hero Image is set)", name: "coverImageAlt", widget: "string", required: false }

      # --- Connections ---
      - { label: "Related Experience Story (optional — the URL slug of an Experience story, e.g. \"addverb-enterprise-transformation\", found in that story's URL)", name: "related_experience", widget: "string", required: false }
      - { label: "From the Field — short context (optional, completes \"This idea came from work I did while ...\"; falls back to the story title if left blank)", name: "from_the_field_context", widget: "string", required: false }
      - label: "Start a Conversation — Opportunity Type (optional, preselects this on the Contact form when someone clicks through from this article)"
        name: "contact_intent"
        widget: "select"
        options: ["transformation", "advisory", "policy"]
        required: false
      - { label: "Start a Conversation — Topic (optional, short slug carried through as context, e.g. \"erp-transformation\")", name: "contact_topic", widget: "string", required: false }

      # --- LinkedIn ---
      - { label: "LinkedIn Adaptation (optional, internal only)", name: "linkedin_adaptation", widget: "text", required: false, hint: "A shorter LinkedIn-ready version of this idea. This does not publish automatically, and never appears on the website — it just keeps the website article and its LinkedIn version together in one record." }
      - { label: "LinkedIn Post URL (optional)", name: "linkedin_post_url", widget: "string", required: false, hint: "Add the LinkedIn URL after publishing the post. Once set, a \"Discuss this on LinkedIn →\" link appears on the article." }

      # --- SEO & Social ---
      - { label: "SEO Title (optional)", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Description (optional)", name: "seoDescription", widget: "text", required: false }
      - { label: "Social Share Image (optional)", name: "ogImage", widget: "image", required: false }

      # --- Publishing ---
      - { label: "Publication Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "Parul Soni Manvati" }
      - { label: "Featured (one of the three top Featured Thinking slots)", name: "featured", widget: "boolean", default: false }
      - { label: "Display Order (optional — lower shows first among Featured or More Notes; leave blank to sort by date)", name: "display_order", widget: "number", required: false }
      - { label: "Published (turn on to make this article live — leave off while still drafting)", name: "published", widget: "boolean", default: false }

  - name: "recommendations"
    label: "Recommendations"
    folder: "src/recommendations"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Permalink (leave as false)", name: "permalink", widget: "hidden", default: false }
      - { label: "Slug (lowercase, hyphenated, must be unique — used to link this recommendation to a story)", name: "slug", widget: "string" }
      - { label: "Quote (the full, genuine quote — preserved exactly as given, never rewritten)", name: "quote", widget: "text" }
      - { label: "Short Excerpt (optional — a verbatim shorter snippet for compact display; the full quote is used if left blank)", name: "short_excerpt", widget: "text", required: false }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Current Role / Title (optional, editable as it changes)", name: "role", widget: "string", required: false }
      - { label: "Organisation (where you worked together)", name: "organisation", widget: "string", required: false }
      - { label: "Relationship / Context (e.g. \"Senior colleague; supply-chain efficiency programme\")", name: "relationship_context", widget: "string", required: false }
      - { label: "Profile / LinkedIn URL (optional)", name: "profile_url", widget: "string", required: false }
      - { label: "Photo (optional)", name: "image", widget: "image", required: false }
      - { label: "Photo Alt Text (optional)", name: "image_alt", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Display Order", name: "display_order", widget: "number", default: 99 }
      - { label: "Published (show on live site)", name: "published", widget: "boolean", default: false }

  - name: "advisory"
    label: "Advisory"
    files:
      - name: "advisory"
        label: "Advisory Page"
        file: "src/_data/advisory.json"
        fields:
          - { label: "Hero — Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero — Heading", name: "heroHeading", widget: "string" }
          - { label: "Hero — Supporting Text", name: "heroIntro", widget: "text" }
          - { label: "Positioning Heading (\"I am usually most useful when...\")", name: "positioningHeading", widget: "string" }
          - label: "Situation Cards (six, shown under the positioning heading — the whole card links to Contact)"
            name: "situations"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Accent Colour"
                name: "accent"
                widget: "select"
                options: ["terracotta", "gold", "slate", "sage", "forest", "rose"]
              - label: "Contact Opportunity Type (preselects this on the Contact form)"
                name: "contactIntent"
                widget: "select"
                options: ["leadership", "transformation", "ceo-advisory", "advisory", "investor", "board", "government", "policy", "speaking", "collaboration", "other"]
                default: "transformation"
              - { label: "Contact Topic (passed through as context, e.g. \"operating-model\")", name: "contactTopic", widget: "string" }
              - { label: "Enabled (show on site)", name: "enabled", widget: "boolean", default: true }
              - { label: "Order", name: "order", widget: "number" }
          - { label: "Engagement Types — Heading", name: "engagementHeading", widget: "string" }
          - label: "Engagement Types (editorial rows, not a price table)"
            name: "engagementTypes"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Typical Outcome (optional)", name: "outcome", widget: "string", required: false }
              - { label: "CTA Label (e.g. \"Discuss a diagnostic\" — the arrow is added automatically)", name: "ctaLabel", widget: "string" }
              - label: "Contact Opportunity Type (preselects this on the Contact form)"
                name: "contactIntent"
                widget: "select"
                options: ["leadership", "transformation", "ceo-advisory", "advisory", "investor", "board", "government", "policy", "speaking", "collaboration", "other"]
                default: "transformation"
              - { label: "Contact Topic (optional, passed through as context, e.g. \"portfolio-support\")", name: "contactTopic", widget: "string", required: false }
              - { label: "Enabled (show on site)", name: "enabled", widget: "boolean", default: true }
              - { label: "Order", name: "order", widget: "number" }
          - { label: "\"Other Conversations\" — Heading", name: "otherConversationsHeading", widget: "string" }
          - { label: "\"Other Conversations\" — Text (board, leadership, speaking, collaborations)", name: "otherConversationsText", widget: "text" }
          - { label: "Primary CTA Label", name: "finalCtaPrimaryLabel", widget: "string" }
          - { label: "LinkedIn CTA Label", name: "linkedinCtaLabel", widget: "string" }

  - name: "speaking"
    label: "Speaking"
    files:
      - name: "speakingTopics"
        label: "Speaking Topics"
        file: "src/_data/speakingTopics.json"
        fields:
          - label: "Topics"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Keywords (short, middot-separated — always visible, not hidden behind a click)", name: "keywords", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Example Talk Titles (illustrative — not a record of past talks)", name: "talks", widget: "list", required: false }
      - name: "speakingEvents"
        label: "Speaking Events"
        file: "src/_data/speakingEvents.json"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Event Name", name: "title", widget: "string" }
              - { label: "Organisation (optional)", name: "organisation", widget: "string", required: false }
              - { label: "Speaking Topic", name: "topic", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Video URL (shows \"Watch talk →\")", name: "videoUrl", widget: "string", required: false }
              - { label: "External URL (shows \"Learn more →\" if there's no video)", name: "externalUrl", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Published (show on site)", name: "published", widget: "boolean", default: false }

  - name: "navigation"
    label: "Navigation"
    files:
      - name: "navigation"
        label: "Main Navigation"
        file: "src/_data/navigation.json"
        fields:
          - label: "Navigation Items"
            name: "items"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "Site Settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Positioning Statement", name: "positioning", widget: "string" }
          - { label: "Public Contact Email", name: "email", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
          - { label: "Bio", name: "bio", widget: "text" }
          - { label: "Default SEO Title", name: "siteTitle", widget: "string" }
          - { label: "Default Meta Description", name: "metaDescription", widget: "text" }
          - { label: "Default Social Share Image", name: "ogImage", widget: "image", required: false }
          - { label: "Favicon", name: "favicon", widget: "image", required: false }
          - { label: "Footer Text", name: "footerText", widget: "string" }
          - { label: "Copyright Year", name: "copyrightYear", widget: "string" }
