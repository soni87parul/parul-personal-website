              - { label: "Description", name: "description", widget: "text" }
              - { label: "Example Talk Titles (illustrative — not a record of past talks)", name: "talks", widget: "list", required: false }
      - name: "speakingPage"
        label: "Speaking Page Media (hero photo and circular video)"
        file: "src/_data/speakingPage.json"
        fields:
          - { label: "Hero Photograph (a large, genuine speaking photo; shows a placeholder until added)", name: "heroImage", widget: "image", required: false }
          - { label: "Hero Photograph Alt Text", name: "heroImageAlt", widget: "string", required: false }
          - { label: "Topics Introduction (short speaker note under \"What I speak about\"; name only events you have actually spoken at)", name: "topicsIntro", widget: "text", required: false }
          - { label: "Circular Media Video (approved clip only; plays muted, looped, no audio)", name: "circularVideo", widget: "file", required: false }
          - { label: "Circular Media Poster Image (shown if motion is reduced or the video is missing)", name: "circularPoster", widget: "image", required: false }
      - name: "speakingMoments"
        label: "Featured Speaking Photographs (expanding panels, shown in rows of four)"
        file: "src/_data/speakingMoments.json"
        fields:
          - label: "Panels (shown in rows of four; add in multiples of four)"
            name: "items"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Photo ID from src/_data/photos.json (for example snapdeal-stage, nitie). Photographs are processed conventionally; never regenerate or retouch faces.", name: "photo", widget: "string" }
              - { label: "Label (always visible)", name: "label", widget: "string" }
              - { label: "Caption (shown on hover, focus and mobile)", name: "caption", widget: "string" }
              - { label: "Event Context (small caps line)", name: "context", widget: "string" }
      - name: "aboutThinking"
        label: "About: What Shapes My Thinking (chapters with small photo clusters)"
        file: "src/_data/aboutThinking.json"
        fields:
          - { label: "Small label above the title", name: "label", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Opening line", name: "intro", widget: "text", required: false }
          - label: "Chapters"
            name: "chapters"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "One line in your voice", name: "line", widget: "text" }
              - label: "Photographs (original photos only; ids from src/_data/photos.json)"
                name: "photos"
                widget: "list"
                summary: "{{fields.photo}}"
                fields:
                  - { label: "Photo ID", name: "photo", widget: "string" }
                  - { label: "Caption (optional small name or line on the photo)", name: "caption", widget: "string", required: false }
      - name: "speakingEvents"
        label: "Speaking Events"
        file: "src/_data/speakingEvents.json"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Event Name", name: "title", widget: "string" }
              - { label: "Organisation (optional)", name: "organisation", widget: "string", required: false }
              - { label: "Speaking Topic", name: "topic", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Video URL (shows \"Watch talk →\")", name: "videoUrl", widget: "string", required: false }
              - { label: "External URL (shows \"Learn more →\" if there's no video)", name: "externalUrl", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Published (show on site)", name: "published", widget: "boolean", default: false }

